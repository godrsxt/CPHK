name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Find project folder and auto-fix imports
        run: |
          ROOT=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"
          SVC=$(find "$ROOT" -name AssistService.kt | head -1)
          if ! grep -q "import com.venice.carromassist.core.GameState" "$SVC"; then
            sed -i '0,/^import /s//import com.venice.carromassist.core.GameState\nimport /' "$SVC"
          fi
          find "$ROOT" -name "*.kt" | sort

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CarromAssist-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
